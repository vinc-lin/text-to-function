[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t2f"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
model = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["t2f*", "eval*", "sim*", "scene*"]   # research/ and cli/ are deliberately NOT packaged

[tool.pytest.ini_options]
markers = ["model: tests that load the real embedding model (needs network/torch)"]
addopts = "-m 'not model'"
