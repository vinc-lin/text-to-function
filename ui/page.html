<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene Engine</title>
<!--
  One self-contained file: inline CSS, inline JS, no CDN, no framework, no build step.
  ui/server.py reads this off disk on every GET /, so a save is one refresh away.

  What this page is for: a text table cannot show perception DECAYING. Confidence sitting in
  a near-miss band, a TTL draining toward expiry, a cooldown counting down — those are states,
  and this renders them as states. If it ends up a prettier /context, it has failed.

  Everything the driver can do here goes through POST /action/<name>, which is ui/actions.py's
  five-entry table and nothing else. Yes submits the utterance 好 and No submits 不用, both
  through /action/say — the same lexicon the terminal types into. There is exactly one route
  to the car and this page is not a second one.
-->
<style>
  :root {
    --bg:      #090c11;
    --panel:   #10141c;
    --panel-2: #151a24;
    --line:    #232c3a;
    --line-2:  #2e3949;
    --ink:     #d3dbe7;
    --dim:     #7c8798;
    --faint:   #4a5567;
    --ok:      #35c88a;
    --warn:    #e8a33d;
    --slate:   #6f7f95;
    --bad:     #e2584a;
    --live:    #4aa8e8;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.45 var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; min-height: 100%;
  }

  /* ---------------------------------------------------------------- header */
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  .brand {
    font: 600 11px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase;
    color: var(--dim); white-space: nowrap;
  }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip {
    font: 11px/1 var(--mono); padding: 4px 7px; border-radius: 3px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
  }
  .chip.fake { color: var(--warn); border-color: #4a3a1c; }
  .clock { font: 11px/1 var(--mono); color: var(--dim); white-space: nowrap; }
  .clock b { color: var(--live); font-weight: 600; }
  .clock.shifted b { color: var(--warn); }
  .controls { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  button, input {
    font: 12px/1 var(--sans); color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 4px;
    padding: 6px 9px;
  }
  button { cursor: pointer; }
  button:hover { border-color: #435269; background: #1b2230; }
  button:active { transform: translateY(1px); }
  button.danger { color: #e9a79f; border-color: #4a2b27; }
  button.danger:hover { background: #2a1917; border-color: #6d3a34; }
  button.primary { color: #0a1a14; background: var(--ok); border-color: var(--ok); font-weight: 600; }
  button.primary:hover { background: #47dc9c; }
  input { background: #0c1016; }
  input:focus, button:focus-visible { outline: 1px solid var(--live); outline-offset: 1px; }
  .toggle .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--faint); margin-right: 6px; vertical-align: 1px;
  }
  .toggle.on .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }

  /* -------------------------------------------------------------- banners */
  .banner {
    display: none; padding: 7px 16px; font: 12px/1.3 var(--mono);
    background: #2a1512; color: #f0a89f; border-bottom: 1px solid #5b2a24;
  }
  .banner.show { display: block; }
  #errbar { background: #2b2211; color: #f2c98c; border-bottom-color: #5c4a20; }
  #errbar .x { float: right; cursor: pointer; color: #8a7a55; padding: 0 4px; }

  /* ---------------------------------------------------------------- panes */
  main { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .cols {
    display: grid; gap: 12px;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: start;
  }
  .pane {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    display: flex; flex-direction: column; min-width: 0;
  }
  .pane > h2 {
    margin: 0; padding: 9px 12px; border-bottom: 1px solid var(--line);
    font: 600 10px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase;
    color: var(--dim); display: flex; align-items: center; gap: 8px;
  }
  .pane > h2 .count {
    font: 10px/1 var(--mono); letter-spacing: 0; color: var(--faint);
    margin-left: auto; text-transform: none;
  }
  .body { padding: 10px 12px; }
  .empty { color: var(--faint); font: 12px/1.4 var(--mono); padding: 6px 0 4px; }
  .sub {
    padding: 8px 12px 4px; border-top: 1px solid var(--line);
    font: 600 10px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase;
    color: var(--faint);
  }

  /* --------------------------------------------------------- observe form */
  .observe {
    display: flex; gap: 5px; flex-wrap: wrap; align-items: center;
    padding: 9px 12px; border-bottom: 1px solid var(--line); background: #0c1016;
  }
  .observe input { padding: 5px 6px; font: 11px/1 var(--mono); min-width: 0; }
  .observe .k { flex: 2 1 108px; }
  .observe .v { flex: 1 1 74px; }
  .observe .c { flex: 0 1 54px; }
  .observe .t { flex: 0 1 54px; }
  .observe button { padding: 5px 10px; font-size: 11px; }

  /* ----------------------------------------------------------- perception */
  .obs {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px;
    padding: 9px 10px 8px; margin-bottom: 8px;
    transition: opacity .85s ease, transform .85s ease, filter .85s ease;
  }
  .obs:last-child { margin-bottom: 0; }
  .obs.gone {
    opacity: 0; transform: translateY(-5px) scale(.985);
    filter: grayscale(1); pointer-events: none;
  }
  .obs-head { display: flex; align-items: baseline; gap: 8px; }
  .obs-key { font: 12px/1.2 var(--mono); color: var(--dim); overflow-wrap: anywhere; }
  .obs-val {
    font: 600 13px/1.2 var(--mono); color: var(--ink); margin-left: auto;
    max-width: 55%; overflow-wrap: anywhere; text-align: right;
  }
  .obs-meta { font: 10px/1.4 var(--mono); color: var(--faint); margin-top: 2px; }

  .bar { display: flex; align-items: center; gap: 7px; margin-top: 7px; }
  .bar-tag {
    font: 9px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); width: 26px; flex: none;
  }
  .bar-num {
    font: 10px/1 var(--mono); color: var(--dim); width: 46px; flex: none; text-align: right;
  }

  .ttl-track {
    position: relative; flex: 1; height: 5px; min-width: 0;
    background: #0a0e14; border-radius: 3px; overflow: hidden;
    box-shadow: inset 0 0 0 1px #1b2330;
  }
  .ttl-fill {
    position: absolute; top: 0; bottom: 0; left: 0; width: 100%;
    background: linear-gradient(90deg, #2a6f9e, var(--live)); border-radius: 3px;
  }
  .ttl-fill.low { background: linear-gradient(90deg, #8a5c17, var(--warn)); }
  .bar.low .bar-num { color: var(--warn); }

  .conf-wrap { flex: 1; min-width: 0; }
  .conf-track {
    position: relative; height: 9px; border-radius: 3px; overflow: hidden;
    box-shadow: inset 0 0 0 1px #1b2330; background: #0a0e14;
  }
  .conf-bands { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .conf-fill {
    position: absolute; top: 0; bottom: 0; left: 0; height: 100%;
    background: var(--faint); transition: width .25s ease, background .25s ease;
  }
  .conf-fill.near { background: var(--warn); }
  .conf-fill.over { background: var(--ok); }
  .conf-track .tick {
    position: absolute; top: 0; bottom: 0; width: 1px; background: #cfd8e6; opacity: .55;
  }
  .conf-ticks { position: relative; height: 11px; margin-top: 2px; }
  .conf-ticks span {
    position: absolute; top: 0; transform: translateX(-50%);
    font: 9px/1 var(--mono); color: var(--faint); white-space: nowrap;
  }

  /* ------------------------------------------------------------------ car */
  .sig {
    display: flex; align-items: baseline; gap: 8px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2);
    margin-bottom: 6px; font: 11px/1.3 var(--mono);
  }
  .sig:last-child { margin-bottom: 0; }
  .sig .ent { color: var(--dim); overflow-wrap: anywhere; }
  .sig .attr { color: var(--ink); overflow-wrap: anywhere; }
  .sig .val { margin-left: auto; font-weight: 600; color: var(--live); }
  @keyframes flashrow {
    0%   { background: rgba(74,168,232,.30); border-color: var(--live); }
    100% { background: var(--panel-2); border-color: var(--line); }
  }
  .sig.flash { animation: flashrow 1.1s ease-out; }

  .op {
    display: flex; align-items: baseline; gap: 7px;
    font: 11px/1.5 var(--mono); padding: 2px 0; overflow-wrap: anywhere;
  }
  .op .fn { color: var(--ink); }
  .op .why { color: var(--faint); margin-left: auto; text-align: right; }
  .op.refused .fn { color: #e9a79f; }

  .tag {
    font: 9px/1 var(--mono); padding: 3px 5px; border-radius: 3px; flex: none;
    text-transform: uppercase; letter-spacing: .08em;
  }
  .tag.executed { color: var(--ok);  background: rgba(53,200,138,.10); box-shadow: inset 0 0 0 1px rgba(53,200,138,.28); }
  .tag.refused  { color: var(--bad); background: rgba(226,88,74,.10);  box-shadow: inset 0 0 0 1px rgba(226,88,74,.30); }

  /* ---------------------------------------------------------------- rules */
  .rule {
    border: 1px solid var(--line); border-left: 2px solid var(--faint); border-radius: 4px;
    background: var(--panel-2); padding: 8px 10px; margin-bottom: 8px;
  }
  .rule:last-child { margin-bottom: 0; }
  .rule.v-match          { border-left-color: var(--ok); }
  .rule.v-near_miss      { border-left-color: var(--warn); }
  .rule.v-reject         { border-left-color: var(--slate); }
  .rule.v-not_applicable { border-left-color: #2b3442; opacity: .62; }
  .rule.v-error          { border-left-color: var(--bad); }
  .rule.suppressed .badge { text-decoration: line-through; }
  .rule-head { display: flex; align-items: center; gap: 8px; }
  .rule-id { font: 11px/1 var(--mono); color: var(--dim); overflow-wrap: anywhere; }
  .badge {
    font: 9px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 6px; border-radius: 3px; flex: none;
  }
  .badge.match          { color: var(--ok);    background: rgba(53,200,138,.12); box-shadow: inset 0 0 0 1px rgba(53,200,138,.32); }
  .badge.near_miss      { color: var(--warn);  background: rgba(232,163,61,.12); box-shadow: inset 0 0 0 1px rgba(232,163,61,.32); }
  .badge.reject         { color: var(--slate); background: rgba(111,127,149,.12); box-shadow: inset 0 0 0 1px rgba(111,127,149,.32); }
  .badge.not_applicable { color: var(--faint); background: rgba(74,85,103,.12);  box-shadow: inset 0 0 0 1px rgba(74,85,103,.30); }
  .badge.error          { color: var(--bad);   background: rgba(226,88,74,.12);  box-shadow: inset 0 0 0 1px rgba(226,88,74,.34); }
  .reason { font: 11px/1.45 var(--mono); color: var(--ink); margin-top: 6px; overflow-wrap: anywhere; }
  .supp {
    margin-top: 6px; padding: 4px 6px; border-radius: 3px;
    font: 10px/1.4 var(--mono); color: var(--warn);
    background: rgba(232,163,61,.07); box-shadow: inset 0 0 0 1px rgba(232,163,61,.26);
    overflow-wrap: anywhere;
  }
  .bands { font: 10px/1.4 var(--mono); color: var(--faint); margin-top: 5px; overflow-wrap: anywhere; }
  .fallback {
    padding: 9px 12px; border-top: 1px solid var(--line);
    font: 11px/1.45 var(--mono); color: var(--dim); overflow-wrap: anywhere;
  }
  .fallback b {
    display: block; font: 600 9px/1 var(--sans); letter-spacing: .14em;
    text-transform: uppercase; color: var(--faint); margin-bottom: 4px;
  }

  /* --------------------------------------------------------- conversation */
  .talk { padding: 10px 12px; max-height: 42vh; overflow-y: auto; }
  .turn { display: flex; margin-bottom: 7px; }
  .turn:last-child { margin-bottom: 0; }
  .bubble {
    max-width: 78%; padding: 6px 10px; border-radius: 5px;
    font: 12px/1.5 var(--sans); overflow-wrap: anywhere;
  }
  .bubble .who {
    display: block; font: 9px/1 var(--mono); letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint); margin-bottom: 3px;
  }
  .turn.driver { justify-content: flex-end; }
  .turn.driver .bubble { background: #1b2f42; box-shadow: inset 0 0 0 1px #26445e; }
  .turn.car .bubble    { background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); }
  .turn.scene .bubble  {
    background: rgba(232,163,61,.07); box-shadow: inset 0 0 0 1px rgba(232,163,61,.28);
    color: #f0cd97;
  }

  .pending {
    display: none; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 0 12px 10px; padding: 9px 11px; border-radius: 5px;
    background: rgba(232,163,61,.08); box-shadow: inset 0 0 0 1px rgba(232,163,61,.38);
  }
  .pending.show { display: flex; }
  .pending .q { font: 13px/1.4 var(--sans); color: #f5d7a5; flex: 1 1 240px; }
  .pending .scene { display: block; font: 10px/1 var(--mono); color: var(--faint); margin-top: 4px; }
  .pending .count { font: 600 15px/1 var(--mono); color: var(--warn); min-width: 48px; text-align: right; }
  .pending .drain { flex: 0 0 100%; height: 3px; border-radius: 2px; background: #1a1710; overflow: hidden; }
  .pending .drain i { display: block; height: 100%; width: 100%; background: var(--warn); }

  .compose { display: flex; gap: 7px; padding: 0 12px 12px; }
  .compose input { flex: 1; font: 13px/1 var(--sans); padding: 8px 10px; min-width: 0; }

  body.stale main { opacity: .55; filter: saturate(.5); }

  @media (max-width: 900px) {
    .cols { grid-template-columns: 1fr; }
    .controls { margin-left: 0; width: 100%; }
    .obs-val { max-width: 60%; }
  }
</style>
</head>
<body>

<header>
  <span class="brand">Scene Engine</span>
  <span class="chips" id="mode"></span>
  <span class="clock" id="clock">clock <b>+0s</b></span>
  <span class="controls">
    <button data-clock="10">+10s</button>
    <button data-clock="30">+30s</button>
    <button data-clock="120">+120s</button>
    <button id="llm" class="toggle"><span class="dot"></span><span id="llmtxt">fallback off</span></button>
    <button id="reset" class="danger">reset</button>
  </span>
</header>

<div class="banner" id="offline">disconnected — no answer from the server. Showing the last snapshot; it is stale.</div>
<div class="banner" id="errbar"><span class="x" id="errx">&times;</span><span id="errtxt"></span></div>

<main>
  <div class="cols">

    <section class="pane">
      <h2>Perception <span class="count" id="pcount"></span></h2>
      <form class="observe" id="obsform">
        <input class="k" id="okey"  value="rear_occupant" aria-label="key"        placeholder="key">
        <input class="v" id="oval"  value="child"         aria-label="value"      placeholder="value">
        <input class="c" id="oconf" value="0.62"          aria-label="confidence" placeholder="conf">
        <input class="t" id="ottl"  value=""              aria-label="ttl"        placeholder="ttl">
        <button type="submit">observe</button>
      </form>
      <div class="body" id="perception"></div>
    </section>

    <section class="pane">
      <h2>The car <span class="count" id="ccount"></span></h2>
      <div class="body" id="car"></div>
      <div class="sub">Operations &middot; newest first</div>
      <div class="body" id="log"></div>
    </section>

    <section class="pane">
      <h2>Rules <span class="count" id="rcount"></span></h2>
      <div class="body" id="rules"></div>
      <div class="fallback" id="fallback" hidden><b>Fallback</b><span id="fallbacktxt"></span></div>
    </section>

  </div>

  <section class="pane">
    <h2>Conversation</h2>
    <div class="talk" id="talk"></div>
    <div class="pending" id="pending">
      <span class="q"><span id="pq"></span><span class="scene" id="pscene"></span></span>
      <span class="count" id="pcountdown"></span>
      <button class="primary" id="yes">Yes &middot; 好</button>
      <button id="no">No &middot; 不用</button>
      <span class="drain"><i id="pdrain"></i></span>
    </div>
    <form class="compose" id="composeform">
      <input id="utterance" placeholder="say something to the car …" autocomplete="off">
      <button type="submit">send</button>
    </form>
  </section>
</main>

<script>
"use strict";
(function () {

const POLL_MS = 400;
const FADE_MS = 900;   // must outlast the .obs transition, or a card is yanked mid-fade

// ------------------------------------------------------------------ helpers
const $ = function (id) { return document.getElementById(id); };

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  // textContent throughout, never innerHTML: every string here came off the wire, and half
  // of what this instrument shows is a sentence a driver typed.
  if (text !== undefined) n.textContent = text;
  return n;
}

// `value` is untyped in the snapshot — "child", true and 42 have all come back from /state.
function show(v) { return (v === null || v === undefined) ? "—" : String(v); }

function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

function secs(r) {
  if (r >= 100) return Math.round(r) + "s";
  if (r >= 10) return r.toFixed(0) + "s";
  if (r > 0) return r.toFixed(1) + "s";
  return "0s";
}

function ago(a) {
  if (a < 1) return "just now";
  if (a < 60) return Math.round(a) + "s ago";
  return Math.round(a / 60) + "m ago";
}

function now() { return performance.now() / 1000; }

// -------------------------------------------------------------------- state
let snap = null;
let firstSnapshot = true;
const obsCards = new Map();   // perception key -> card record, carrying its ttl anchor
const carRows = new Map();    // "entity|attribute" -> row record, carrying its last value
const ruleRows = new Map();   // rule_id -> row record
let pending = null;           // {scene, anchor, expiresIn, max}
let lastTalk = "";
let lastLog = "";

// ---------------------------------------------------------------- transport
function fail(msg) {
  $("errtxt").textContent = msg;
  $("errbar").classList.add("show");
  clearTimeout(fail.t);
  fail.t = setTimeout(function () { $("errbar").classList.remove("show"); }, 8000);
}
$("errx").onclick = function () { $("errbar").classList.remove("show"); };

function online(ok) {
  $("offline").classList.toggle("show", !ok);
  document.body.classList.toggle("stale", !ok);
}

function poll() {
  fetch("/state", { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (state) { apply(state); online(true); })
    // The bars keep draining — time really is passing — but the banner says the numbers
    // behind them have stopped being refreshed. Freezing silently on stale data is the one
    // failure an instrument may not have.
    .catch(function () { online(false); })
    .then(function () { setTimeout(poll, POLL_MS); });
}

function act(name, body) {
  return fetch("/action/" + name, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  }).then(function (res) {
    return res.json().catch(function () { return null; }).then(function (data) {
      if (!res.ok) {
        // A 400 arrives as {"error": "..."} and is shown, never swallowed: a mistyped
        // confidence has to read as a refusal, not as a click that did nothing.
        fail((data && data.error) || ("HTTP " + res.status));
        return null;
      }
      online(true);
      // The new state rides back with the reply, so the page moves on the click rather than
      // up to a poll interval later.
      if (data && data.state) apply(data.state);
      return data;
    });
  }).catch(function (e) {
    online(false);
    fail("action failed: " + e);
    return null;
  });
}

// ------------------------------------------------------------------- header
function renderHeader(s) {
  const parts = String(s.mode || "—").split("·").map(function (p) {
    return p.trim();
  }).filter(Boolean);
  const box = $("mode");
  box.textContent = "";
  parts.forEach(function (p) {
    box.appendChild(el("span", p === "FAKE" ? "chip fake" : "chip", p));
  });

  const off = Number(s.clock_offset) || 0;
  const c = $("clock");
  c.textContent = "clock ";
  c.appendChild(el("b", null, (off >= 0 ? "+" : "") + off.toFixed(0) + "s"));
  c.classList.toggle("shifted", off !== 0);

  $("llm").classList.toggle("on", !!s.scene_llm);
  $("llmtxt").textContent = s.scene_llm ? "fallback on" : "fallback off";
}

// --------------------------------------------------------------- perception
// Which rule's bands belong on which card: `observed_keys` is what that field is for. A
// near-miss then reads as a POSITION between the floor and the threshold rather than as two
// numbers to hold in your head and compare.
function bandsFor(key, rules) {
  let best = null;
  for (let i = 0; i < rules.length; i++) {
    const r = rules[i];
    if (!r.observed_keys || r.observed_keys.indexOf(key) < 0) continue;
    // A report with rule_id "—" is the row observe() records when the engine itself raised;
    // it carries null bands and must not be drawn as though it had any.
    if (typeof r.threshold !== "number" || typeof r.floor !== "number") continue;
    if (!best) best = r;
    if (r.verdict === "near_miss") { best = r; break; }
  }
  return best;
}

function newObsCard() {
  const card = el("div", "obs");

  const head = el("div", "obs-head");
  const key = el("span", "obs-key");
  const val = el("span", "obs-val");
  head.appendChild(key);
  head.appendChild(val);

  const meta = el("div", "obs-meta");

  const cbar = el("div", "bar");
  const cwrap = el("div", "conf-wrap");
  const ctrack = el("div", "conf-track");
  const cbands = el("div", "conf-bands");
  const cfill = el("div", "conf-fill");
  const tfloor = el("i", "tick");
  const tthr = el("i", "tick");
  ctrack.appendChild(cbands);
  ctrack.appendChild(cfill);
  ctrack.appendChild(tfloor);
  ctrack.appendChild(tthr);
  const cticks = el("div", "conf-ticks");
  const lfloor = el("span");
  const lthr = el("span");
  cticks.appendChild(lfloor);
  cticks.appendChild(lthr);
  cwrap.appendChild(ctrack);
  cwrap.appendChild(cticks);
  const cnum = el("div", "bar-num");
  cbar.appendChild(el("div", "bar-tag", "conf"));
  cbar.appendChild(cwrap);
  cbar.appendChild(cnum);

  const tbar = el("div", "bar");
  const ttrack = el("div", "ttl-track");
  const tfill = el("div", "ttl-fill");
  ttrack.appendChild(tfill);
  const tnum = el("div", "bar-num");
  tbar.appendChild(el("div", "bar-tag", "ttl"));
  tbar.appendChild(ttrack);
  tbar.appendChild(tnum);

  card.appendChild(head);
  card.appendChild(meta);
  card.appendChild(cbar);
  card.appendChild(tbar);
  return { el: card, key: key, val: val, meta: meta, cbands: cbands, cfill: cfill,
           tfloor: tfloor, tthr: tthr, lfloor: lfloor, lthr: lthr, cnum: cnum,
           tbar: tbar, tfill: tfill, tnum: tnum };
}

function renderPerception(rows, rules) {
  const box = $("perception");
  const seen = {};

  rows.forEach(function (row) {
    seen[row.key] = true;
    let c = obsCards.get(row.key);
    if (!c) {
      c = newObsCard();
      obsCards.set(row.key, c);
      box.appendChild(c.el);
    }
    // A card that was fading is alive again: cancel the removal, rather than letting a timer
    // delete an observation that has come back.
    if (c.gone) {
      clearTimeout(c.timer);
      c.gone = false;
      c.el.classList.remove("gone");
    }

    c.key.textContent = row.key;
    c.val.textContent = show(row.value);
    c.meta.textContent = show(row.source) + " · " + ago(Number(row.age) || 0);

    const conf = Number(row.confidence) || 0;
    const band = bandsFor(row.key, rules);
    c.cnum.textContent = conf.toFixed(2);
    c.cfill.style.width = (clamp01(conf) * 100).toFixed(1) + "%";
    c.cfill.classList.toggle("over", !!band && conf >= band.threshold);
    c.cfill.classList.toggle("near", !!band && conf >= band.floor && conf < band.threshold);
    if (band) {
      const f = clamp01(band.floor) * 100;
      const t = clamp01(band.threshold) * 100;
      c.cbands.style.background =
        "linear-gradient(90deg, rgba(74,85,103,.16) 0 " + f + "%," +
        " rgba(232,163,61,.16) " + f + "% " + t + "%," +
        " rgba(53,200,138,.16) " + t + "% 100%)";
      c.tfloor.style.left = f + "%";
      c.tthr.style.left = t + "%";
      c.tfloor.hidden = false;
      c.tthr.hidden = false;
      c.lfloor.style.left = f + "%";
      c.lfloor.textContent = "floor " + band.floor.toFixed(2);
      c.lthr.style.left = t + "%";
      c.lthr.textContent = "fire " + band.threshold.toFixed(2);
    } else {
      c.cbands.style.background = "";
      c.tfloor.hidden = true;
      c.tthr.hidden = true;
      c.lfloor.textContent = "";
      c.lthr.textContent = "";
    }

    // The anchor, not the width. The bar is drained from these two numbers on every frame,
    // so between polls it moves continuously instead of stepping once every 400ms.
    c.expiresIn = Number(row.expires_in) || 0;
    c.ttl = Number(row.ttl) || c.expiresIn || 1;
    c.anchor = now();
  });

  obsCards.forEach(function (c, key) {
    if (!seen[key] && !c.gone) markGone(key, c);
  });
  $("pcount").textContent = rows.length ? rows.length + " live" : "";
  emptyState(box, obsCards.size === 0, "nothing observed");
}

// An expiry you can watch: the card fades and then goes, rather than being there on one poll
// and simply absent on the next.
function markGone(key, c) {
  c.gone = true;
  // Emptied on the way out, and not left wherever the interpolation had got to. A card can
  // leave the snapshot while the client still believes it has time — an advanced clock does
  // exactly that — and fading out a bar frozen at 96% would say it vanished with plenty
  // left, which is the opposite of what happened.
  c.tfill.style.width = "0%";
  c.tfill.classList.add("low");
  c.tbar.classList.add("low");
  c.tnum.textContent = "0s";
  c.el.classList.add("gone");
  c.timer = setTimeout(function () {
    c.el.remove();
    obsCards.delete(key);
    emptyState($("perception"), obsCards.size === 0, "nothing observed");
  }, FADE_MS);
}

// ---------------------------------------------------------------------- car
function renderCar(rows) {
  const box = $("car");
  const seen = {};
  rows.forEach(function (row) {
    const id = row.entity + "|" + row.attribute;
    seen[id] = true;
    let r = carRows.get(id);
    if (!r) {
      const node = el("div", "sig");
      const value = el("span", "val");
      node.appendChild(el("span", "ent", row.entity));
      node.appendChild(el("span", "attr", row.attribute));
      node.appendChild(value);
      r = { el: node, val: value, value: undefined };
      carRows.set(id, r);
      box.appendChild(node);
    }
    const v = show(row.value);
    if (r.value !== v) {
      r.value = v;
      r.val.textContent = v;
      // The snapshot carries no previous value, so movement is diffed here across polls.
      // Suppressed on the first snapshot: a reload would otherwise flash every row at once
      // and say "everything just changed" about a car that has been sitting still.
      if (!firstSnapshot) {
        r.el.classList.remove("flash");
        void r.el.offsetWidth;   // reflow, so a repeat change restarts the animation
        r.el.classList.add("flash");
      }
    }
  });
  carRows.forEach(function (r, id) {
    if (!seen[id]) { r.el.remove(); carRows.delete(id); }
  });
  $("ccount").textContent = rows.length ? rows.length + " moved" : "";
  emptyState(box, carRows.size === 0, "unchanged from seeded");
}

function renderLog(rows) {
  const sig = JSON.stringify(rows);
  if (sig === lastLog) return;
  lastLog = sig;
  const box = $("log");
  box.textContent = "";
  if (!rows.length) { box.appendChild(el("div", "empty", "nothing executed")); return; }
  // Newest first, as the snapshot hands them over. Not re-sorted.
  rows.forEach(function (r) {
    const line = el("div", "op" + (r.outcome === "refused" ? " refused" : ""));
    line.appendChild(el("span", "tag " + r.outcome, r.outcome));
    line.appendChild(el("span", "fn", r.function));
    const why = [r.error, r.detail].filter(Boolean).join(" · ");
    if (why) line.appendChild(el("span", "why", why));
    box.appendChild(line);
  });
}

// -------------------------------------------------------------------- rules
function renderRules(rows, fallback) {
  const box = $("rules");
  const seen = {};
  rows.forEach(function (row) {
    seen[row.rule_id] = true;
    let r = ruleRows.get(row.rule_id);
    if (!r) {
      const node = el("div", "rule");
      const head = el("div", "rule-head");
      const badge = el("span", "badge");
      head.appendChild(badge);
      head.appendChild(el("span", "rule-id", row.rule_id));
      const reason = el("div", "reason");
      const supp = el("div", "supp");
      const bands = el("div", "bands");
      node.appendChild(head);
      node.appendChild(reason);
      node.appendChild(supp);
      node.appendChild(bands);
      r = { el: node, badge: badge, reason: reason, supp: supp, bands: bands };
      ruleRows.set(row.rule_id, r);
      box.appendChild(node);
    }
    r.el.className = "rule v-" + row.verdict + (row.suppressed_by ? " suppressed" : "");
    r.badge.className = "badge " + row.verdict;
    r.badge.textContent = row.verdict;
    r.reason.textContent = row.reason || "";
    // A rule that matched and still said nothing is the state most worth seeing, so the
    // suppressor gets its own marked line instead of being appended to the reason.
    r.supp.textContent = row.suppressed_by ? "suppressed · " + row.suppressed_by : "";
    r.supp.hidden = !row.suppressed_by;
    const banded = typeof row.floor === "number" && typeof row.threshold === "number";
    r.bands.textContent = banded
      ? "floor " + row.floor.toFixed(2) + " · fire " + row.threshold.toFixed(2) +
        (row.observed_keys && row.observed_keys.length
          ? " · " + row.observed_keys.join(", ") : "")
      : "";
    r.bands.hidden = !banded;
  });
  ruleRows.forEach(function (r, id) {
    if (!seen[id]) { r.el.remove(); ruleRows.delete(id); }
  });
  $("rcount").textContent = rows.length ? rows.length + " evaluated" : "";
  emptyState(box, ruleRows.size === 0, "no observation yet");

  // "" is not a note. It is a fresh session, or an observation a rule answered outright —
  // rendering it would hang an empty labelled box under the rules for most of a session.
  const note = fallback || "";
  $("fallback").hidden = !note;
  $("fallbacktxt").textContent = note;
}

// ------------------------------------------------------------- conversation
function renderTalk(rows) {
  const sig = JSON.stringify(rows);
  if (sig === lastTalk) return;
  lastTalk = sig;
  const box = $("talk");
  const stuck = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.textContent = "";
  if (!rows.length) { box.appendChild(el("div", "empty", "nothing said yet")); return; }
  // Oldest first, as the snapshot hands them over. Not reversed.
  rows.forEach(function (t) {
    const who = t.who === "driver" ? "driver" : (t.who === "scene" ? "scene" : "car");
    const turn = el("div", "turn " + who);
    const bubble = el("div", "bubble");
    bubble.appendChild(el("span", "who", t.who));
    bubble.appendChild(document.createTextNode(t.text || ""));
    turn.appendChild(bubble);
    box.appendChild(turn);
  });
  if (stuck) box.scrollTop = box.scrollHeight;
}

function renderPending(p) {
  const bar = $("pending");
  if (!p) {
    pending = null;
    bar.classList.remove("show");
    return;
  }
  const fresh = Number(p.expires_in) || 0;
  if (!pending || pending.scene !== p.scene) {
    // The consent ttl is not in the snapshot, so the widest remaining time yet seen for THIS
    // question is the denominator: honest, and it follows the ttl if it is ever changed.
    pending = { scene: p.scene, max: fresh };
  }
  pending.max = Math.max(pending.max, fresh);
  pending.expiresIn = fresh;
  pending.anchor = now();
  $("pq").textContent = p.question || "(this rule has no sentence)";
  $("pscene").textContent = p.scene;
  bar.classList.add("show");
}

function emptyState(box, isEmpty, text) {
  const e = box.querySelector(".empty");
  if (isEmpty && !e) box.appendChild(el("div", "empty", text));
  if (!isEmpty && e) e.remove();
}

// -------------------------------------------------------------------- apply
function apply(s) {
  snap = s;
  renderHeader(s);
  renderPerception(s.perception || [], s.rules || []);
  renderCar(s.car || []);
  renderLog(s.log || []);
  renderRules(s.rules || [], s.fallback);
  renderTalk(s.conversation || []);
  renderPending(s.pending);
  firstSnapshot = false;
  frame();
}

// The only thing that runs every frame is the interpolation of what is draining. Everything
// else waits for a poll.
function frame() {
  const t = now();

  obsCards.forEach(function (c, key) {
    if (c.gone) return;
    const rem = Math.max(0, c.expiresIn - (t - c.anchor));
    const frac = c.ttl > 0 ? clamp01(rem / c.ttl) : 0;
    c.tfill.style.width = (frac * 100).toFixed(2) + "%";
    c.tfill.classList.toggle("low", frac < 0.2);
    c.tbar.classList.toggle("low", frac < 0.2);
    c.tnum.textContent = secs(rem);
    // Expiry is noticed here rather than waited for: the next poll may be 400ms away and the
    // card would sit at zero looking alive.
    if (rem <= 0) markGone(key, c);
  });

  if (pending) {
    const rem = Math.max(0, pending.expiresIn - (t - pending.anchor));
    $("pcountdown").textContent = rem.toFixed(1) + "s";
    $("pdrain").style.width =
      ((pending.max > 0 ? clamp01(rem / pending.max) : 0) * 100).toFixed(2) + "%";
  }
}

(function loop() { frame(); requestAnimationFrame(loop); })();

// ------------------------------------------------------------------- wiring
const clockButtons = document.querySelectorAll("[data-clock]");
for (let i = 0; i < clockButtons.length; i++) {
  clockButtons[i].onclick = (function (b) {
    return function () { act("clock", { seconds: Number(b.getAttribute("data-clock")) }); };
  })(clockButtons[i]);
}

$("reset").onclick = function () { act("reset", {}); };

$("llm").onclick = function () { act("scene_llm", { on: !(snap && snap.scene_llm) }); };

$("obsform").onsubmit = function (e) {
  e.preventDefault();
  const key = $("okey").value.trim();
  // Stopped here rather than sent: the session namespaces the key and accepts an empty one,
  // so a stray submit would leave a permanent card called "inside." in the pane.
  if (!key) { fail("an observation needs a key"); return; }
  const body = { key: key, value: $("oval").value, confidence: $("oconf").value.trim() };
  // Omitted rather than defaulted. Session.OBSERVATION_TTL is the session's answer to "how
  // long", and a number typed in here would give the page a second opinion about it.
  const ttl = $("ottl").value.trim();
  if (ttl) body.ttl = ttl;
  act("observe", body);
};

function say(utterance) {
  if (!utterance) return;
  act("say", { utterance: utterance });
}

$("composeform").onsubmit = function (e) {
  e.preventDefault();
  const box = $("utterance");
  const text = box.value.trim();
  if (!text) return;
  box.value = "";
  say(text);
};

// Consent has exactly one shape and one route to the car. These two buttons submit the same
// utterances the terminal types, through the same POST /action/say — they do not call the
// executor and they do not reach into the engine. A button that bypassed the lexicon would
// be a second route with its own rules, which is the thing this design forbids.
$("yes").onclick = function () { say("好"); };
$("no").onclick = function () { say("不用"); };

poll();

})();
</script>
</body>
</html>
